name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install (not editable, so the installed package is what is tested)
        run: python -m pip install ".[data]"
      - name: Fetch Databento's public 4-record sample for the decode test
        run: bash scripts/fetch_test_data.sh
      - name: Tests (C++ core required)
        env:
          MBOQ_REQUIRE_CORE: "1"
        run: python tests/test_mboq.py
      - name: Benchmark smoke test (also checks C++ == Python output)
        run: python scripts/bench.py --quick
      - name: Synthetic end-to-end run
        run: python scripts/run_day.py --synthetic --out "$RUNNER_TEMP/run_day"

  # The C++ core built with AddressSanitizer + UndefinedBehaviorSanitizer (in place, not installed), then the full
  # test suite (including the randomized C++-vs-Python differential test) and the benchmark smoke test run against
  # it. Any sanitizer report fails the job (UBSan: no recovery; ASan aborts on the first error). Leak detection is
  # off because CPython itself does not free everything at exit.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the C++ core with -fsanitize=address,undefined
        run: |
          python -m pip install numpy pybind11
          SUFFIX="$(python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')"
          g++ -std=c++20 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined \
              -ffp-contract=off -shared -fPIC $(python -m pybind11 --includes) cpp/mboq_core.cpp \
              -o "src/mboq/_core${SUFFIX}"
      - name: Tests and benchmark smoke test under the sanitizers (C++ core required)
        env:
          MBOQ_REQUIRE_CORE: "1"
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          export LD_PRELOAD="$(g++ -print-file-name=libasan.so) $(g++ -print-file-name=libubsan.so)"
          python -c "import sys; sys.path.insert(0, 'src'); import mboq._core as c; print(c.__file__)"
          python tests/test_mboq.py
          python scripts/bench.py --quick
